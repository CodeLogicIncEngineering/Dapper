# codelogic-build-feedback
name: Main Build

on:
  pull_request:
  push:
    branches:
    - main
    - 'codelogic/**'
    paths:
    - '*'
    - '!/docs/*' # Don't run workflow when files are only in the /docs directory

jobs:
  vm-job:
    name: Ubuntu
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
        - 5432/tcp
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        ports:
        - 1433/tcp
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "Password."
      mysql:
        image: mysql
        ports:
        - 3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v1
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: .NET Build
      env:
        NO_COLOR: "1"
        TERM: dumb
      run: dotnet build Build.csproj -c Release /p:CI=true 2>&1 | tee build.log
    - name: Dapper Tests
      env:
        NO_COLOR: "1"
        TERM: dumb
        MySqlConnectionString: Server=localhost;Port=${{ job.services.mysql.ports[3306] }};Uid=root;Pwd=root;Database=test;Allow User Variables=true
        OLEDBConnectionString: Provider=SQLOLEDB;Server=tcp:localhost,${{ job.services.sqlserver.ports[1433] }};Database=tempdb;User Id=sa;Password=Password.;
        PostgesConnectionString: Server=localhost;Port=${{ job.services.postgres.ports[5432] }};Database=test;User Id=postgres;Password=postgres;
        SqlServerConnectionString: Server=tcp:localhost,${{ job.services.sqlserver.ports[1433] }};Database=tempdb;User Id=sa;Password=Password.;
      run: dotnet test tests/Dapper.Tests/Dapper.Tests.csproj -c Release --logger GitHubActions -p:CI=true -p:TestTfmsInParallel=false 2>&1 | tee -a build.log
    - name: .NET Lib Pack
      env:
        NO_COLOR: "1"
        TERM: dumb
      run: dotnet pack Build.csproj --no-build -c Release /p:PackageOutputPath=%CD%\.nupkgs /p:CI=true 2>&1 | tee -a build.log
    - name: Send CodeLogic Build Info
      if: always()
      uses: CodeLogicIncEngineering/codelogic-send-build-info-github-action@v1.0.2
      with:
        codelogic_host: ${{ vars.CODELOGIC_HOST }}
        agent_uuid: ${{ vars.AGENT_UUID }}
        agent_password: ${{ secrets.AGENT_PASSWORD }}
        scan_path: /github/workspace
        job_name: ${{ github.workflow }}
        build_number: ${{ github.run_number }}
        build_status: ${{ job.status }}
        pipeline_system: GitHub Actions
        log_file: /github/workspace/build.log
